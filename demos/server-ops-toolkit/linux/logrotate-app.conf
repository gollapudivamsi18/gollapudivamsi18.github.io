# /etc/logrotate.d/orders-app - example rotation for an application log.
# Rotate daily, keep 14 days compressed, and do not break the app's open file handle.
/var/log/orders-app/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 orders adm
    # copytruncate avoids a restart for apps that cannot reopen their log;
    # prefer a postrotate signal when the app supports it.
    copytruncate
}
