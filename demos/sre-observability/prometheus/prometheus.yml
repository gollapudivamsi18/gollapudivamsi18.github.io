# Prometheus configuration for the local SRE demo stack (docker compose).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/orders-slo.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: orders
    metrics_path: /metrics
    static_configs:
      - targets: ["orders:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
