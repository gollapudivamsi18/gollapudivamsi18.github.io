# SLO recording and alerting rules for the fictional orders service.
# SLO: 99.5% of /api/orders requests succeed (non-5xx) over 30 days.
# Allowed error ratio = 0.005. Burn-rate thresholds follow the Google SRE
# Workbook multi-window pattern. Independent portfolio demo.
groups:
  - name: orders-slo-recording
    interval: 30s
    rules:
      - record: orders:error_ratio:rate5m
        expr: |
          sum(rate(http_requests_total{route="/api/orders",code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{route="/api/orders"}[5m]))
      - record: orders:error_ratio:rate30m
        expr: |
          sum(rate(http_requests_total{route="/api/orders",code=~"5.."}[30m]))
          /
          sum(rate(http_requests_total{route="/api/orders"}[30m]))
      - record: orders:error_ratio:rate1h
        expr: |
          sum(rate(http_requests_total{route="/api/orders",code=~"5.."}[1h]))
          /
          sum(rate(http_requests_total{route="/api/orders"}[1h]))
      - record: orders:error_ratio:rate6h
        expr: |
          sum(rate(http_requests_total{route="/api/orders",code=~"5.."}[6h]))
          /
          sum(rate(http_requests_total{route="/api/orders"}[6h]))
      - record: orders:latency_p95:5m
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{route="/api/orders"}[5m])))

  - name: orders-slo-alerts
    rules:
      - alert: OrdersErrorBudgetFastBurn
        expr: |
          orders:error_ratio:rate1h > (14.4 * 0.005)
          and
          orders:error_ratio:rate5m > (14.4 * 0.005)
        for: 2m
        labels:
          severity: page
          service: orders
        annotations:
          summary: "Orders API is burning error budget 14x faster than allowed"
          description: "At this rate 2% of the 30-day budget is gone within an hour."
          runbook_url: "https://github.com/gollapudivamsi18/gollapudivamsi18.github.io/blob/main/demos/sre-observability/runbooks/error-budget-burn.md"

      - alert: OrdersErrorBudgetSlowBurn
        expr: |
          orders:error_ratio:rate6h > (6 * 0.005)
          and
          orders:error_ratio:rate30m > (6 * 0.005)
        for: 15m
        labels:
          severity: page
          service: orders
        annotations:
          summary: "Orders API is burning error budget 6x faster than allowed"
          description: "Sustained errors; 5% of the 30-day budget is spent every 6 hours."
          runbook_url: "https://github.com/gollapudivamsi18/gollapudivamsi18.github.io/blob/main/demos/sre-observability/runbooks/error-budget-burn.md"

      - alert: OrdersLatencyP95High
        expr: orders:latency_p95:5m > 0.5
        for: 10m
        labels:
          severity: ticket
          service: orders
        annotations:
          summary: "Orders API p95 latency above 500 ms for 10 minutes"
          runbook_url: "https://github.com/gollapudivamsi18/gollapudivamsi18.github.io/blob/main/demos/sre-observability/runbooks/latency.md"

      - alert: OrdersTargetDown
        expr: up{job="orders"} == 0
        for: 1m
        labels:
          severity: page
          service: orders
        annotations:
          summary: "Prometheus cannot scrape the orders service"
          runbook_url: "https://github.com/gollapudivamsi18/gollapudivamsi18.github.io/blob/main/demos/sre-observability/runbooks/error-budget-burn.md"
