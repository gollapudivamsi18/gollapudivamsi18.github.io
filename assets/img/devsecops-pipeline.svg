<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" aria-labelledby="t d"><title id="t">GitHub Actions DevSecOps pipeline</title><desc id="d">A pull request triggers five parallel jobs: Ruff lint, unit and HTTP tests with an 80 percent coverage gate, Bandit static analysis, Gitleaks secret scan, and pip-audit plus dependency review. When all pass, the container job builds the image, smoke-tests it, checks it runs as a non-root user, scans it with Trivy and produces a CycloneDX SBOM. Image and SBOM are stored as build artifacts. A manual run on main reaches the demo-staging environment, which only prints what it would deploy.</desc><style>text{font-family:'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;fill:#14213D}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#4A5568}.w{font-size:14px;font-weight:700;fill:#fff}.h{font-size:13px;font-weight:700;fill:#0B5CAD;letter-spacing:.04em}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A2A4E"/></marker></defs><rect width="560" height="640" fill="#fff"/><text class="h" x="20" y="26" text-anchor="start">GITHUB-HOSTED RUNNERS · NO CLOUD CREDENTIALS</text><rect x="130" y="40" width="300" height="56" rx="10" fill="#1A2A4E" stroke="#1A2A4E" stroke-width="2"/><text class="w" x="280.0" y="64.0" text-anchor="middle">Pull request / push</text><text class="w" style="font-weight:400;font-size:12.5px" x="280.0" y="82.0" text-anchor="middle">demos/github-actions-devsecops/**</text><line x1="280" y1="96" x2="64" y2="138" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="140" width="88" height="72" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="64.0" y="172.0" text-anchor="middle">lint</text><text class="s" x="64.0" y="190.0" text-anchor="middle">Ruff</text><line x1="64" y1="212" x2="280" y2="262" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="96" x2="172" y2="138" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="128" y="140" width="88" height="72" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="172.0" y="172.0" text-anchor="middle">test</text><text class="s" x="172.0" y="190.0" text-anchor="middle">≥ 80% cov.</text><line x1="172" y1="212" x2="280" y2="262" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="96" x2="280" y2="138" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="236" y="140" width="88" height="72" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="280.0" y="172.0" text-anchor="middle">sast</text><text class="s" x="280.0" y="190.0" text-anchor="middle">Bandit</text><line x1="280" y1="212" x2="280" y2="262" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="96" x2="388" y2="138" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="344" y="140" width="88" height="72" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="388.0" y="172.0" text-anchor="middle">secrets</text><text class="s" x="388.0" y="190.0" text-anchor="middle">Gitleaks</text><line x1="388" y1="212" x2="280" y2="262" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="96" x2="496" y2="138" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="452" y="140" width="88" height="72" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="496.0" y="172.0" text-anchor="middle">deps</text><text class="s" x="496.0" y="190.0" text-anchor="middle">pip-audit</text><line x1="496" y1="212" x2="280" y2="262" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><text class="s" x="352" y="254" text-anchor="start">all five must pass</text><rect x="110" y="264" width="340" height="150" rx="10" fill="#1A2A4E" stroke="#1A2A4E" stroke-width="2"/><text class="w" x="280.0" y="299.0" text-anchor="middle">container</text><text class="w" style="font-weight:400;font-size:12.5px" x="280.0" y="317.0" text-anchor="middle">docker build</text><text class="w" style="font-weight:400;font-size:12.5px" x="280.0" y="335.0" text-anchor="middle">smoke test /healthz + /api/items</text><text class="w" style="font-weight:400;font-size:12.5px" x="280.0" y="353.0" text-anchor="middle">assert non-root user (10001)</text><text class="w" style="font-weight:400;font-size:12.5px" x="280.0" y="371.0" text-anchor="middle">Trivy: fail on fixable CRITICAL</text><text class="w" style="font-weight:400;font-size:12.5px" x="280.0" y="389.0" text-anchor="middle">CycloneDX SBOM</text><line x1="280" y1="414" x2="280" y2="452" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="454" width="340" height="56" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text class="t" x="280.0" y="478.0" text-anchor="middle">Build artifacts (7 days)</text><text class="s" x="280.0" y="496.0" text-anchor="middle">image tarball · SBOM · coverage.xml</text><line x1="280" y1="510" x2="280" y2="548" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><text class="s" x="288.0" y="533.0">manual run on main</text><rect x="110" y="550" width="340" height="70" rx="10" fill="#E6F4EA" stroke="#2F7D4F" stroke-width="2" stroke-dasharray="6 4"/><text class="t" x="280.0" y="572.0" text-anchor="middle">environment: demo-staging</text><text class="s" x="280.0" y="590.0" text-anchor="middle">prints what it would deploy</text><text class="s" x="280.0" y="608.0" text-anchor="middle">real path: OIDC → Azure (docs)</text></svg>
