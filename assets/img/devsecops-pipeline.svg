<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="ttl dsc"><title id="ttl">GitHub Actions DevSecOps pipeline</title><desc id="dsc">A pull request fans out to five parallel jobs: Ruff lint, tests with an 80 percent coverage gate, Bandit SAST, Gitleaks secret scanning and pip-audit. A container job then builds, smoke-tests and scans the image with Trivy and produces an SBOM. A manual run on main reaches a demo-staging environment that only prints what it would deploy.</desc><style>svg{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.n{fill:#11264a;stroke:#26497d}.ln{fill:none;stroke-width:1.6;stroke-linejoin:round}.t{font-size:12.5px;font-weight:600;fill:#eaf2ff}.s{font-size:10.5px;fill:#93abd0}.m{font:10px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#93abd0;white-space:pre}.gl{font-size:9.5px;font-weight:700;letter-spacing:.09em}.lbl{font-size:9.5px;font-weight:600}.flow{stroke-dasharray:5 5;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a33"/><stop offset="1" stop-color="#081226"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d3560"/></pattern><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2dd4bf"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5b84b"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/></marker></defs><rect width="720" height="350" rx="14" fill="url(#bg)"/><rect width="720" height="350" rx="14" fill="url(#dots)" opacity=".55"/><g><rect x="16" y="140" width="128" height="60" rx="9" class="n"/><rect x="16" y="148" width="3" height="44" rx="1.5" fill="#3b9cff"/><text x="29" y="160" class="t">Pull request</text><text x="29" y="176" class="s">or push to main</text></g><g><rect x="196" y="30" width="166" height="46" rx="9" class="n"/><rect x="196" y="38" width="3" height="30" rx="1.5" fill="#a78bfa"/><text x="209" y="50" class="t">Lint</text><text x="209" y="66" class="s">Ruff · bandit rules</text></g><path d="M144,170 L170,170 L170,53 L195,53" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><path d="M362,53 L388,53 L388,170 L411,170" stroke="#a78bfa" class="ln" marker-end="url(#v)"/><g><rect x="196" y="88" width="166" height="46" rx="9" class="n"/><rect x="196" y="96" width="3" height="30" rx="1.5" fill="#a78bfa"/><text x="209" y="108" class="t">Test</text><text x="209" y="124" class="s">unittest · coverage ≥ 80%</text></g><path d="M144,170 L170,170 L170,111 L195,111" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><path d="M362,111 L388,111 L388,170 L411,170" stroke="#a78bfa" class="ln" marker-end="url(#v)"/><g><rect x="196" y="146" width="166" height="46" rx="9" class="n"/><rect x="196" y="154" width="3" height="30" rx="1.5" fill="#a78bfa"/><text x="209" y="166" class="t">SAST</text><text x="209" y="182" class="s">Bandit · medium+ fails</text></g><path d="M144,170 L170,170 L170,169 L195,169" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><path d="M362,169 L388,169 L388,170 L411,170" stroke="#a78bfa" class="ln" marker-end="url(#v)"/><g><rect x="196" y="204" width="166" height="46" rx="9" class="n"/><rect x="196" y="212" width="3" height="30" rx="1.5" fill="#a78bfa"/><text x="209" y="224" class="t">Secrets</text><text x="209" y="240" class="s">Gitleaks · full tree</text></g><path d="M144,170 L170,170 L170,227 L195,227" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><path d="M362,227 L388,227 L388,170 L411,170" stroke="#a78bfa" class="ln" marker-end="url(#v)"/><g><rect x="196" y="262" width="166" height="46" rx="9" class="n"/><rect x="196" y="270" width="3" height="30" rx="1.5" fill="#a78bfa"/><text x="209" y="282" class="t">Dependencies</text><text x="209" y="298" class="s">pip-audit · dep. review</text></g><path d="M144,170 L170,170 L170,285 L195,285" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><path d="M362,285 L388,285 L388,170 L411,170" stroke="#a78bfa" class="ln" marker-end="url(#v)"/><text x="196" y="22" class="gl" fill="#a78bfa" text-anchor="start">5 JOBS IN PARALLEL</text><g><rect x="412" y="106" width="152" height="128" rx="9" class="n"/><rect x="412" y="114" width="3" height="112" rx="1.5" fill="#2dd4bf"/><text x="425" y="126" class="t">Container job</text><text x="425" y="142" class="s">docker build</text><text x="425" y="157" class="s">smoke test /healthz</text><text x="425" y="172" class="s">non-root check</text><text x="425" y="187" class="s">Trivy · CRITICAL fails</text><text x="425" y="202" class="s">CycloneDX SBOM</text></g><g><rect x="586" y="90" width="120" height="56" rx="9" class="n"/><rect x="586" y="98" width="3" height="40" rx="1.5" fill="#f5b84b"/><text x="599" y="110" class="t">Manual run</text><text x="599" y="126" class="m">workflow_dispatch</text></g><g><rect x="586" y="196" width="120" height="56" rx="9" class="n" stroke-dasharray="5 4"/><rect x="586" y="204" width="3" height="40" rx="1.5" fill="#2dd4bf"/><text x="599" y="216" class="t">demo-staging</text><text x="599" y="232" class="s">prints plan only</text></g><path d="M564,150 L575,150 L575,118 L585,118" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><path d="M646,146 L646,195" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><text x="586" y="274" class="s" text-anchor="start">OIDC to Azure:</text><text x="586" y="288" class="s" text-anchor="start">documented only</text><text x="16" y="330" class="s" text-anchor="start">Fails on: lint finding · coverage &lt; 80% · medium+ SAST · leaked secret · vulnerable dependency · fixable CRITICAL CVE · root container</text></svg>
