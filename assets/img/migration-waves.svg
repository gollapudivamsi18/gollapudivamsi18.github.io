<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t d">
<title id="t">Migration dependency map and waves</title><desc id="d">Wave 0 domain controller first. Waves 1 and 2 low-risk pilots. Wave 3 SampleTracker Linux stack with reports. Wave 4 LabPortal Windows stack: web servers, app server, SQL and file server move together.</desc>
<style>text{font-family:'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;fill:#14213D} .t{font-size:17px;font-weight:700} .s{font-size:13.5px;fill:#4A5568} .n{font-size:13px;font-weight:700;fill:#fff} .h{font-size:20px;font-weight:700}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A2A4E"/></marker></defs>
<rect width="560" height="560" fill="#fff"/>
<rect x="20" y="16" width="520" height="70" rx="10" fill="#FFF6E5" stroke="#B7791F" stroke-width="2"/>
<text class="t" x="34" y="48">Wave 0 - shared services</text><text class="s" x="34" y="67">DEMO-DC01 (Active Directory)</text>
<line x1="280" y1="86" x2="280" y2="116" stroke="#1A2A4E" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="20" y="116" width="520" height="70" rx="10" fill="#EEF4F7" stroke="#1C6F73" stroke-width="2"/>
<text class="t" x="34" y="148">Waves 1-2 - pilots</text><text class="s" x="34" y="167">DEV01 (dev/test) · LNX05 (ops)</text>
<line x1="280" y1="186" x2="280" y2="216" stroke="#1A2A4E" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="20" y="216" width="520" height="70" rx="10" fill="#EEF4F7" stroke="#1C6F73" stroke-width="2"/>
<text class="t" x="34" y="248">Wave 3 - SampleTracker + Reports</text><text class="s" x="34" y="267">Nginx -&gt; Tomcat -&gt; PostgreSQL &lt;- Batch</text>
<line x1="280" y1="286" x2="280" y2="316" stroke="#1A2A4E" stroke-width="2.2" marker-end="url(#a)"/>
<rect x="20" y="316" width="520" height="70" rx="10" fill="#FDECEC" stroke="#C53030" stroke-width="2"/>
<text class="t" x="34" y="348">Wave 4 - LabPortal</text><text class="s" x="34" y="367">WEB01/02 -&gt; APP01 -&gt; SQL01 · FS01</text>
<text class="t" x="36" y="430" text-anchor="start" >Rules</text>
<text class="s" x="36" y="454" text-anchor="start" >· Servers that depend on each other move in the same wave</text>
<text class="s" x="36" y="476" text-anchor="start" >· Shared services first, then lower-risk groups</text>
<text class="s" x="36" y="498" text-anchor="start" >· Source servers stay powered off (not deleted) until hypercare ends</text>
<text class="s" x="280" y="540" text-anchor="middle" >Independent portfolio demo · synthetic inventory</text>
</svg>
