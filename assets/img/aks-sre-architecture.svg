<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="ttl dsc"><title id="ttl">AKS and Helm delivery with SRE practices</title><desc id="dsc">Azure Pipelines runs tests, helm lint and an image scan, pushes to ACR, deploys to AKS staging with an atomic Helm upgrade and smoke test, waits for approval, then deploys to production with HPA, PDB and probes. Prometheus recording rules feed burn-rate alerts and an incident runbook; the error-budget policy pauses releases when more than 75% of the budget is spent.</desc><style>svg{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.n{fill:#11264a;stroke:#26497d}.ln{fill:none;stroke-width:1.6;stroke-linejoin:round}.t{font-size:12.5px;font-weight:600;fill:#eaf2ff}.s{font-size:10.5px;fill:#93abd0}.m{font:10px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#93abd0;white-space:pre}.gl{font-size:9.5px;font-weight:700;letter-spacing:.09em}.lbl{font-size:9.5px;font-weight:600}.flow{stroke-dasharray:5 5;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a33"/><stop offset="1" stop-color="#081226"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d3560"/></pattern><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2dd4bf"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5b84b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7f97bf"/></marker></defs><rect width="720" height="330" rx="14" fill="url(#bg)"/><rect width="720" height="330" rx="14" fill="url(#dots)" opacity=".55"/><text x="16" y="26" class="gl" fill="#2dd4bf" text-anchor="start">DELIVERY</text><g><rect x="16" y="40" width="124" height="58" rx="9" class="n"/><rect x="16" y="48" width="3" height="42" rx="1.5" fill="#3b9cff"/><text x="29" y="60" class="t">Azure Pipelines</text><text x="29" y="76" class="s">tests · helm lint · scan</text></g><g><rect x="158" y="40" width="124" height="58" rx="9" class="n"/><rect x="158" y="48" width="3" height="42" rx="1.5" fill="#3b9cff"/><text x="171" y="60" class="t">ACR</text><text x="171" y="76" class="m">image:&lt;git-sha&gt;</text></g><g><rect x="300" y="40" width="124" height="58" rx="9" class="n"/><rect x="300" y="48" width="3" height="42" rx="1.5" fill="#2dd4bf"/><text x="313" y="60" class="t">AKS staging</text><text x="313" y="76" class="s">--atomic · smoke test</text></g><g><rect x="442" y="40" width="124" height="58" rx="9" class="n"/><rect x="442" y="48" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="455" y="60" class="t">Approval</text><text x="455" y="76" class="s">ADO env. check</text></g><g><rect x="584" y="40" width="124" height="58" rx="9" class="n"/><rect x="584" y="48" width="3" height="42" rx="1.5" fill="#2dd4bf"/><text x="597" y="60" class="t">AKS production</text><text x="597" y="76" class="s">HPA · PDB · probes</text></g><path d="M140,69 L157,69" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><path d="M282,69 L299,69" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><path d="M424,69 L441,69" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><path d="M566,69 L583,69" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><text x="16" y="168" class="gl" fill="#f5b84b" text-anchor="start">SRE LOOP</text><g><rect x="442" y="182" width="124" height="58" rx="9" class="n"/><rect x="442" y="190" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="455" y="202" class="t">Prometheus</text><text x="455" y="218" class="s">recording rules · SLI</text></g><g><rect x="300" y="182" width="124" height="58" rx="9" class="n"/><rect x="300" y="190" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="313" y="202" class="t">Burn-rate alert</text><text x="313" y="218" class="s">14.4x over 1h and 5m</text></g><g><rect x="158" y="182" width="124" height="58" rx="9" class="n"/><rect x="158" y="190" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="171" y="202" class="t">Incident runbook</text><text x="171" y="218" class="s">triage · rollback</text></g><g><rect x="16" y="182" width="124" height="58" rx="9" class="n"/><rect x="16" y="190" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="29" y="202" class="t">Error budget</text><text x="29" y="218" class="s">SLO 99.5% · 28 days</text></g><path d="M646,98 L646,211 L567,211" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><text x="652" y="160" class="lbl" fill="#f5b84b">metrics</text><path d="M442,211 L425,211" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M300,211 L283,211" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M158,211 L141,211" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M78,182 L78,99" stroke="#7f97bf" class="ln" stroke-dasharray="4 4" marker-end="url(#g)"/><text x="86" y="150" class="lbl" fill="#7f97bf">&gt;75% budget spent → pause releases</text><text x="16" y="286" class="s" text-anchor="start">Validated with helm lint, helm template and a local smoke test in CI. Not deployed to a real AKS cluster.</text><text x="16" y="304" class="s" text-anchor="start">Chart: non-root container · liveness/readiness probes · HorizontalPodAutoscaler · PodDisruptionBudget</text></svg>
