<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="ttl dsc"><title id="ttl">Azure platform delivery and operations flow</title><desc id="dsc">Pull requests in GitHub Enterprise run CI in GitHub Actions and Azure Pipelines with security gates, images go to Azure Container Registry and deploy with Helm to AKS inside an Azure landing zone provisioned by Terraform and Bicep. Prometheus, Grafana and Azure Monitor feed SLO burn-rate alerts, on-call runbooks and incident reviews, whose actions return to the backlog.</desc><style>svg{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.n{fill:#11264a;stroke:#26497d}.ln{fill:none;stroke-width:1.6;stroke-linejoin:round}.t{font-size:12.5px;font-weight:600;fill:#eaf2ff}.s{font-size:10.5px;fill:#93abd0}.m{font:10px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#93abd0;white-space:pre}.gl{font-size:9.5px;font-weight:700;letter-spacing:.09em}.lbl{font-size:9.5px;font-weight:600}.flow{stroke-dasharray:5 5;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a33"/><stop offset="1" stop-color="#081226"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d3560"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3b9cff"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2dd4bf"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5b84b"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7f97bf"/></marker></defs><rect width="720" height="440" rx="14" fill="url(#bg)"/><rect width="720" height="440" rx="14" fill="url(#dots)" opacity=".55"/><g><rect x="18" y="34" width="150" height="56" rx="9" class="n"/><rect x="18" y="42" width="3" height="40" rx="1.5" fill="#3b9cff"/><text x="31" y="54" class="t">GitHub Enterprise</text><text x="31" y="70" class="s">PRs · CODEOWNERS</text></g><g><rect x="196" y="34" width="150" height="56" rx="9" class="n"/><rect x="196" y="42" width="3" height="40" rx="1.5" fill="#3b9cff"/><text x="209" y="54" class="t">CI/CD pipelines</text><text x="209" y="70" class="s">Actions · Azure Pipelines</text></g><g><rect x="374" y="34" width="150" height="56" rx="9" class="n"/><rect x="374" y="42" width="3" height="40" rx="1.5" fill="#a78bfa"/><text x="387" y="54" class="t">Security gates</text><text x="387" y="70" class="s">SAST · secrets · images</text></g><g><rect x="552" y="34" width="150" height="56" rx="9" class="n"/><rect x="552" y="42" width="3" height="40" rx="1.5" fill="#3b9cff"/><text x="565" y="54" class="t">Container registry</text><text x="565" y="70" class="s">ACR · versioned images</text></g><path d="M168,62 L195,62" stroke="#3b9cff" class="ln flow" marker-end="url(#a)"/><path d="M346,62 L373,62" stroke="#3b9cff" class="ln flow" marker-end="url(#a)"/><path d="M524,62 L551,62" stroke="#3b9cff" class="ln flow" marker-end="url(#a)"/><rect x="18" y="132" width="500" height="214" rx="12" fill="#2c5288" fill-opacity=".07" stroke="#2c5288" stroke-dasharray="4 5" stroke-width="1.2"/><text x="30" y="150" class="gl" fill="#6f9fe0">AZURE LANDING ZONE · 8 SUBSCRIPTIONS · 600+ RESOURCES</text><g><rect x="34" y="164" width="140" height="56" rx="9" class="n"/><rect x="34" y="172" width="3" height="40" rx="1.5" fill="#2dd4bf"/><text x="47" y="184" class="t">Terraform · Bicep</text><text x="47" y="200" class="s">modules · drift checks</text></g><g><rect x="196" y="164" width="148" height="56" rx="9" class="n"/><rect x="196" y="172" width="3" height="40" rx="1.5" fill="#3b9cff"/><text x="209" y="184" class="t">Networking</text><text x="209" y="200" class="s">VNet · NSG · private DNS</text></g><g><rect x="362" y="164" width="140" height="56" rx="9" class="n"/><rect x="362" y="172" width="3" height="40" rx="1.5" fill="#2dd4bf"/><text x="375" y="184" class="t">AKS · 6 clusters</text><text x="375" y="200" class="s">Helm · Ingress · HPA</text></g><g><rect x="34" y="240" width="230" height="56" rx="9" class="n"/><rect x="34" y="248" width="3" height="40" rx="1.5" fill="#a78bfa"/><text x="47" y="260" class="t">Identity and governance</text><text x="47" y="276" class="s">Entra ID · RBAC · Azure Policy</text></g><g><rect x="282" y="240" width="220" height="56" rx="9" class="n"/><rect x="282" y="248" width="3" height="40" rx="1.5" fill="#a78bfa"/><text x="295" y="260" class="t">Key Vault · Defender</text><text x="295" y="276" class="s">secrets · Secure Score 62→85%</text></g><path d="M174,192 L195,192" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><path d="M627,90 L627,116 L432,116 L432,163" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><text x="470" y="110" class="lbl" fill="#2dd4bf">Helm-based deploys</text><text x="34" y="330" class="s" text-anchor="start">Remote state · nightly drift detection · 98% tagging compliance</text><rect x="530" y="132" width="178" height="292" rx="12" fill="#f5b84b" fill-opacity=".07" stroke="#f5b84b" stroke-dasharray="4 5" stroke-width="1.2"/><text x="542" y="150" class="gl" fill="#f5b84b">OBSERVABILITY · SRE</text><g><rect x="541" y="160" width="156" height="50" rx="9" class="n"/><rect x="541" y="168" width="3" height="34" rx="1.5" fill="#f5b84b"/><text x="554" y="180" class="t">Prometheus · Grafana</text><text x="554" y="196" class="s">150+ alert rules</text></g><g><rect x="541" y="222" width="156" height="50" rx="9" class="n"/><rect x="541" y="230" width="3" height="34" rx="1.5" fill="#f5b84b"/><text x="554" y="242" class="t">Azure Monitor</text><text x="554" y="258" class="s">Log Analytics · KQL</text></g><g><rect x="541" y="284" width="156" height="50" rx="9" class="n"/><rect x="541" y="292" width="3" height="34" rx="1.5" fill="#f5b84b"/><text x="554" y="304" class="t">SLO · error budget</text><text x="554" y="320" class="s">burn-rate paging</text></g><g><rect x="541" y="346" width="156" height="50" rx="9" class="n"/><rect x="541" y="354" width="3" height="34" rx="1.5" fill="#f5b84b"/><text x="554" y="366" class="t">On-call · runbooks</text><text x="554" y="382" class="s">40+ runbooks · RCA</text></g><path d="M502,185 L540,185" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M619,210 L619,221" stroke="#f5b84b" class="ln" marker-end="url(#w)"/><path d="M619,272 L619,283" stroke="#f5b84b" class="ln" marker-end="url(#w)"/><path d="M619,334 L619,345" stroke="#f5b84b" class="ln" marker-end="url(#w)"/><path d="M541,371 L8,371 L8,62 L17,62" stroke="#7f97bf" class="ln flow" marker-end="url(#g)"/><text x="200" y="364" class="lbl" fill="#7f97bf">post-incident actions → backlog</text><text x="18" y="418" class="lbl" fill="#2dd4bf" text-anchor="start">MTTR ↓ ~35%  ·  alert noise ↓ 40%  ·  99.95% platform availability</text></svg>
