<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="ttl dsc"><title id="ttl">Terraform hub-and-spoke network on Azure</title><desc id="dsc">Terraform provisions a hub VNet with firewall, gateway and shared-services subnets, Log Analytics and a Recovery Services vault. Two spoke VNets peer only with the hub and use default-deny NSGs, with a private DNS zone linked to the spokes. An optional VPN connects on-premises and an optional DR region uses Azure Site Recovery.</desc><style>svg{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.n{fill:#11264a;stroke:#26497d}.ln{fill:none;stroke-width:1.6;stroke-linejoin:round}.t{font-size:12.5px;font-weight:600;fill:#eaf2ff}.s{font-size:10.5px;fill:#93abd0}.m{font:10px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#93abd0;white-space:pre}.gl{font-size:9.5px;font-weight:700;letter-spacing:.09em}.lbl{font-size:9.5px;font-weight:600}.flow{stroke-dasharray:5 5;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a33"/><stop offset="1" stop-color="#081226"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d3560"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3b9cff"/></marker><marker id="sa" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#3b9cff"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2dd4bf"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7f97bf"/></marker></defs><rect width="720" height="380" rx="14" fill="url(#bg)"/><rect width="720" height="380" rx="14" fill="url(#dots)" opacity=".55"/><g><rect x="16" y="40" width="136" height="104" rx="9" class="n"/><rect x="16" y="48" width="3" height="88" rx="1.5" fill="#2dd4bf"/><text x="29" y="60" class="t">Terraform</text><text x="29" y="76" class="s">fmt · validate in CI</text><text x="29" y="91" class="s">locals.tags on all</text><text x="29" y="106" class="s">input validation</text><text x="29" y="121" class="s">safe defaults</text></g><path d="M152,92 L189,92" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><text x="152" y="84" class="lbl" fill="#2dd4bf">provisions</text><rect x="190" y="30" width="262" height="246" rx="12" fill="#2c5288" fill-opacity=".07" stroke="#2c5288" stroke-dasharray="4 5" stroke-width="1.2"/><text x="202" y="48" class="gl" fill="#6f9fe0">HUB VNET · 10.10.0.0/22</text><g><rect x="206" y="58" width="230" height="36" rx="9" class="n"/><rect x="206" y="66" width="3" height="20" rx="1.5" fill="#3b9cff"/><text x="219" y="80.5" class="t">AzureFirewallSubnet</text></g><g><rect x="206" y="102" width="230" height="36" rx="9" class="n"/><rect x="206" y="110" width="3" height="20" rx="1.5" fill="#3b9cff"/><text x="219" y="124.5" class="t">GatewaySubnet</text></g><g><rect x="206" y="146" width="230" height="36" rx="9" class="n"/><rect x="206" y="154" width="3" height="20" rx="1.5" fill="#3b9cff"/><text x="219" y="168.5" class="t">Shared services</text></g><g><rect x="206" y="198" width="110" height="58" rx="9" class="n"/><rect x="206" y="206" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="219" y="218" class="t">Log Analytics</text><text x="219" y="234" class="s">retention · daily cap</text></g><g><rect x="326" y="198" width="110" height="58" rx="9" class="n"/><rect x="326" y="206" width="3" height="42" rx="1.5" fill="#2dd4bf"/><text x="339" y="218" class="t">Backup vault</text><text x="339" y="234" class="s">daily policy</text></g><rect x="506" y="30" width="198" height="104" rx="12" fill="#2dd4bf" fill-opacity=".07" stroke="#2dd4bf" stroke-dasharray="4 5" stroke-width="1.2"/><text x="518" y="48" class="gl" fill="#2dd4bf">SPOKE · 10.11.0.0/24</text><g><rect x="520" y="62" width="170" height="56" rx="9" class="n"/><rect x="520" y="70" width="3" height="40" rx="1.5" fill="#a78bfa"/><text x="533" y="82" class="t">Portfolio app</text><text x="533" y="98" class="s">subnet · NSG default deny</text></g><rect x="506" y="150" width="198" height="104" rx="12" fill="#2dd4bf" fill-opacity=".07" stroke="#2dd4bf" stroke-dasharray="4 5" stroke-width="1.2"/><text x="518" y="168" class="gl" fill="#2dd4bf">SPOKE · 10.12.0.0/24</text><g><rect x="520" y="182" width="170" height="56" rx="9" class="n"/><rect x="520" y="190" width="3" height="40" rx="1.5" fill="#a78bfa"/><text x="533" y="202" class="t">Reporting</text><text x="533" y="218" class="s">subnet · NSG default deny</text></g><path d="M453,82 L505,82" stroke="#3b9cff" class="ln" marker-end="url(#a)" marker-start="url(#sa)"/><text x="458" y="74" class="lbl" fill="#3b9cff">peering</text><path d="M453,202 L505,202" stroke="#3b9cff" class="ln" marker-end="url(#a)" marker-start="url(#sa)"/><text x="458" y="194" class="lbl" fill="#3b9cff">peering</text><g><rect x="506" y="276" width="198" height="50" rx="9" class="n"/><rect x="506" y="284" width="3" height="34" rx="1.5" fill="#3b9cff"/><text x="519" y="296" class="t">Private DNS zone</text><text x="519" y="312" class="s">linked to both spokes</text></g><g><rect x="16" y="178" width="136" height="56" rx="9" class="n" stroke-dasharray="5 4"/><rect x="16" y="186" width="3" height="40" rx="1.5" fill="#7f97bf"/><text x="29" y="198" class="t">On-premises</text><text x="29" y="214" class="s">optional S2S VPN</text></g><path d="M152,206 L170,206 L170,120 L205,120" stroke="#7f97bf" class="ln" stroke-dasharray="4 4" marker-end="url(#g)"/><g><rect x="190" y="304" width="262" height="50" rx="9" class="n" stroke-dasharray="5 4"/><rect x="190" y="312" width="3" height="34" rx="1.5" fill="#7f97bf"/><text x="203" y="324" class="t">DR region (optional)</text><text x="203" y="340" class="s">secondary vault · Site Recovery</text></g><path d="M381,257 L381,303" stroke="#7f97bf" class="ln" stroke-dasharray="4 4" marker-end="url(#g)"/><text x="16" y="300" class="s" text-anchor="start">Spokes reach each</text><text x="16" y="314" class="s" text-anchor="start">other only via hub</text><text x="16" y="344" class="s" text-anchor="start">Firewall and VPN</text><text x="16" y="358" class="s" text-anchor="start">gateway not created</text><text x="16" y="372" class="s" text-anchor="start">(cost control)</text></svg>
