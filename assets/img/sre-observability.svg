<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="ttl dsc"><title id="ttl">SRE observability: SLO burn-rate alerting and incident flow</title><desc id="dsc">An instrumented orders service is scraped by Prometheus, which computes error ratios and multi-window burn-rate alerts tested with promtool. Alertmanager routes pages and tickets; runbooks and a blameless RCA close the loop. Grafana shows the SLO dashboard, and an offline error-budget calculator can gate releases.</desc><style>svg{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}.n{fill:#11264a;stroke:#26497d}.ln{fill:none;stroke-width:1.6;stroke-linejoin:round}.t{font-size:12.5px;font-weight:600;fill:#eaf2ff}.s{font-size:10.5px;fill:#93abd0}.m{font:10px ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;fill:#93abd0;white-space:pre}.gl{font-size:9.5px;font-weight:700;letter-spacing:.09em}.lbl{font-size:9.5px;font-weight:600}.flow{stroke-dasharray:5 5;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1a33"/><stop offset="1" stop-color="#081226"/></linearGradient><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1d3560"/></pattern><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2dd4bf"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f5b84b"/></marker><marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/></marker></defs><rect width="720" height="350" rx="14" fill="url(#bg)"/><rect width="720" height="350" rx="14" fill="url(#dots)" opacity=".55"/><g><rect x="16" y="40" width="132" height="58" rx="9" class="n"/><rect x="16" y="48" width="3" height="42" rx="1.5" fill="#3b9cff"/><text x="29" y="60" class="t">Orders service</text><text x="29" y="76" class="s">/metrics · fault inject</text></g><g><rect x="170" y="40" width="132" height="58" rx="9" class="n"/><rect x="170" y="48" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="183" y="60" class="t">Prometheus</text><text x="183" y="76" class="s">rules 5m · 30m · 1h · 6h</text></g><g><rect x="324" y="40" width="132" height="58" rx="9" class="n"/><rect x="324" y="48" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="337" y="60" class="t">Burn-rate alerts</text><text x="337" y="76" class="s">promtool unit-tested</text></g><g><rect x="478" y="40" width="120" height="58" rx="9" class="n"/><rect x="478" y="48" width="3" height="42" rx="1.5" fill="#f5b84b"/><text x="491" y="60" class="t">Alertmanager</text><text x="491" y="76" class="s">inhibit · grouping</text></g><g><rect x="618" y="22" width="88" height="42" rx="9" class="n"/><rect x="618" y="30" width="3" height="26" rx="1.5" fill="#f87171"/><text x="631" y="42" class="t">Page</text><text x="631" y="58" class="s">on-call</text></g><g><rect x="618" y="76" width="88" height="42" rx="9" class="n"/><rect x="618" y="84" width="3" height="26" rx="1.5" fill="#3b9cff"/><text x="631" y="96" class="t">Ticket</text><text x="631" y="112" class="s">backlog</text></g><path d="M148,69 L169,69" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M302,69 L323,69" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M456,69 L477,69" stroke="#f5b84b" class="ln flow" marker-end="url(#w)"/><path d="M598,60 L608,60 L608,43 L617,43" stroke="#f5b84b" class="ln" marker-end="url(#w)"/><path d="M598,78 L608,78 L608,97 L617,97" stroke="#f5b84b" class="ln" marker-end="url(#w)"/><g><rect x="170" y="150" width="132" height="58" rx="9" class="n"/><rect x="170" y="158" width="3" height="42" rx="1.5" fill="#2dd4bf"/><text x="183" y="170" class="t">Grafana</text><text x="183" y="186" class="s">availability · burn · p95</text></g><path d="M236,98 L236,149" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><g><rect x="478" y="150" width="120" height="58" rx="9" class="n"/><rect x="478" y="158" width="3" height="42" rx="1.5" fill="#2dd4bf"/><text x="491" y="170" class="t">Runbooks</text><text x="491" y="186" class="s">burn · latency</text></g><g><rect x="324" y="150" width="132" height="58" rx="9" class="n"/><rect x="324" y="158" width="3" height="42" rx="1.5" fill="#2dd4bf"/><text x="337" y="170" class="t">Blameless RCA</text><text x="337" y="186" class="s">template + example</text></g><path d="M538,98 L538,149" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><path d="M478,179 L457,179" stroke="#2dd4bf" class="ln flow" marker-end="url(#t)"/><text x="16" y="248" class="gl" fill="#a78bfa" text-anchor="start">OFFLINE GATE</text><g><rect x="16" y="260" width="132" height="58" rx="9" class="n"/><rect x="16" y="268" width="3" height="42" rx="1.5" fill="#7f97bf"/><text x="29" y="280" class="t">Synthetic traffic</text><text x="29" y="296" class="s">3 days + incident</text></g><g><rect x="170" y="260" width="132" height="58" rx="9" class="n"/><rect x="170" y="268" width="3" height="42" rx="1.5" fill="#a78bfa"/><text x="183" y="280" class="t">error_budget.py</text><text x="183" y="296" class="s">budget used · alerts</text></g><g><rect x="324" y="260" width="132" height="58" rx="9" class="n"/><rect x="324" y="268" width="3" height="42" rx="1.5" fill="#a78bfa"/><text x="337" y="280" class="t">Release gate</text><text x="337" y="296" class="s">exit 2 blocks release</text></g><path d="M148,289 L169,289" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><path d="M302,289 L323,289" stroke="#a78bfa" class="ln flow" marker-end="url(#v)"/><rect x="478" y="236" width="228" height="100" rx="12" fill="#f5b84b" fill-opacity=".07" stroke="#f5b84b" stroke-dasharray="4 5" stroke-width="1.2"/><text x="490" y="254" class="gl" fill="#f5b84b">SLO 99.5% · 30 DAYS</text><text x="490" y="274" class="m" text-anchor="start">page    14.4x   1h + 5m</text><text x="490" y="292" class="m" text-anchor="start">page    6x      6h + 30m</text><text x="490" y="310" class="m" text-anchor="start">ticket  1x      3d + 6h</text></svg>
