<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="t d"><title id="t">SRE observability demo architecture</title><desc id="d">A load generator calls the orders service. Prometheus scrapes its metrics every 15 seconds, evaluates SLO recording rules and multi-window burn-rate alerts, and sends alerts to Alertmanager. Alertmanager routes pages to the on-call receiver and tickets to a queue; both link to runbooks. Grafana reads from Prometheus. Separately, error_budget.py computes budget and burn rate from exported request counts. Runs locally with Docker Compose; nothing is deployed to Azure.</desc><style>text{font-family:'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;fill:#14213D}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#4A5568}.w{font-size:14px;font-weight:700;fill:#fff}.h{font-size:13px;font-weight:700;fill:#0B5CAD;letter-spacing:.04em}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A2A4E"/></marker></defs><rect width="560" height="600" fill="#fff"/><text class="h" x="20" y="26" text-anchor="start">LOCAL DOCKER COMPOSE STACK · SYNTHETIC TRAFFIC</text><rect x="20" y="40" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text class="t" x="100.0" y="66.0" text-anchor="middle">Load generator</text><text class="s" x="100.0" y="84.0" text-anchor="middle">curl every 100 ms</text><rect x="220" y="40" width="320" height="60" rx="10" fill="#1A2A4E" stroke="#1A2A4E" stroke-width="2"/><text class="w" x="380.0" y="66.0" text-anchor="middle">orders service</text><text class="w" style="font-weight:400;font-size:12.5px" x="380.0" y="84.0" text-anchor="middle">/api/orders · /metrics · probes</text><line x1="180" y1="70" x2="218" y2="70" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="380" y1="100" x2="380" y2="146" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><text class="s" x="388.0" y="127.0">scrape 15s</text><rect x="140" y="148" width="400" height="92" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="340.0" y="181.0" text-anchor="middle">Prometheus</text><text class="s" x="340.0" y="199.0" text-anchor="middle">recording rules: error ratio 5m / 30m / 1h / 6h, p95</text><text class="s" x="340.0" y="217.0" text-anchor="middle">alerts: 14.4x (1h+5m), 6x (6h+30m), latency, target down</text><line x1="250" y1="240" x2="150" y2="300" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><text class="s" x="208.0" y="274.0">alerts</text><line x1="430" y1="240" x2="430" y2="298" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><text class="s" x="438.0" y="273.0">query</text><rect x="20" y="300" width="250" height="74" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="145.0" y="324.0" text-anchor="middle">Alertmanager</text><text class="s" x="145.0" y="342.0" text-anchor="middle">group, route, inhibit</text><text class="s" x="145.0" y="360.0" text-anchor="middle">page vs ticket</text><rect x="310" y="300" width="230" height="74" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="425.0" y="324.0" text-anchor="middle">Grafana</text><text class="s" x="425.0" y="342.0" text-anchor="middle">availability, burn rate,</text><text class="s" x="425.0" y="360.0" text-anchor="middle">p95, scrape status</text><line x1="80" y1="374" x2="80" y2="420" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="210" y1="374" x2="210" y2="420" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="422" width="120" height="58" rx="10" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text class="t" x="80.0" y="447.0" text-anchor="middle">On-call</text><text class="s" x="80.0" y="465.0" text-anchor="middle">severity=page</text><rect x="150" y="422" width="120" height="58" rx="10" fill="#FFF5E5" stroke="#B7791F" stroke-width="2"/><text class="t" x="210.0" y="447.0" text-anchor="middle">Ticket queue</text><text class="s" x="210.0" y="465.0" text-anchor="middle">severity=ticket</text><line x1="145" y1="480" x2="145" y2="516" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="518" width="250" height="62" rx="10" fill="#E6F4EA" stroke="#2F7D4F" stroke-width="2"/><text class="t" x="145.0" y="545.0" text-anchor="middle">Runbook → RCA</text><text class="s" x="145.0" y="563.0" text-anchor="middle">blameless review, actions</text><rect x="310" y="420" width="230" height="160" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="6 4"/><text class="t" x="425.0" y="460.0" text-anchor="middle">error_budget.py</text><text class="s" x="425.0" y="478.0" text-anchor="middle">offline calculator</text><text class="s" x="425.0" y="496.0" text-anchor="middle">budget used / remaining</text><text class="s" x="425.0" y="514.0" text-anchor="middle">burn rate per window</text><text class="s" x="425.0" y="532.0" text-anchor="middle">exit 2 when a page fires</text><text class="s" x="425.0" y="550.0" text-anchor="middle">→ release gate</text></svg>
