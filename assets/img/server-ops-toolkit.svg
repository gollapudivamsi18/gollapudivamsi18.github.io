<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="t d"><title id="t">Windows and Linux server operations toolkit</title><desc id="d">A scheduler (Task Scheduler on Windows, cron on Linux) runs read-only checks. Windows: Get-ServerHealth, Get-PatchReport and Get-ADAccountReport using the shared ServerOps module. Linux: health-check, ssh-hardening-check and user-audit. Results go out as text, JSON or CSV with exit codes 0, 1 or 2 for a monitoring agent. The only state-changing script, Restart-StoppedAutoService, needs an allow-list and asks for confirmation.</desc><style>text{font-family:'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;fill:#14213D}.t{font-size:16px;font-weight:700}.s{font-size:13px;fill:#4A5568}.w{font-size:14px;font-weight:700;fill:#fff}.h{font-size:13px;font-weight:700;fill:#0B5CAD;letter-spacing:.04em}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1A2A4E"/></marker></defs><rect width="560" height="600" fill="#fff"/><rect x="20" y="20" width="250" height="56" rx="10" fill="#1A2A4E" stroke="#1A2A4E" stroke-width="2"/><text class="w" x="145.0" y="44.0" text-anchor="middle">Task Scheduler</text><text class="w" style="font-weight:400;font-size:12.5px" x="145.0" y="62.0" text-anchor="middle">Windows Server</text><rect x="290" y="20" width="250" height="56" rx="10" fill="#1A2A4E" stroke="#1A2A4E" stroke-width="2"/><text class="w" x="415.0" y="44.0" text-anchor="middle">cron</text><text class="w" style="font-weight:400;font-size:12.5px" x="415.0" y="62.0" text-anchor="middle">RHEL / Ubuntu</text><line x1="145" y1="76" x2="145" y2="108" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="415" y1="76" x2="415" y2="108" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="110" width="250" height="150" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="145.0" y="154.0" text-anchor="middle">PowerShell (read-only)</text><text class="s" x="145.0" y="172.0" text-anchor="middle">Get-ServerHealth</text><text class="s" x="145.0" y="190.0" text-anchor="middle">Get-PatchReport</text><text class="s" x="145.0" y="208.0" text-anchor="middle">Get-ADAccountReport</text><text class="s" x="145.0" y="226.0" text-anchor="middle">ServerOps.psm1 (tested)</text><rect x="290" y="110" width="250" height="150" rx="10" fill="#E8F2FC" stroke="#0B5CAD" stroke-width="2"/><text class="t" x="415.0" y="154.0" text-anchor="middle">Bash (read-only)</text><text class="s" x="415.0" y="172.0" text-anchor="middle">health-check.sh</text><text class="s" x="415.0" y="190.0" text-anchor="middle">ssh-hardening-check.sh</text><text class="s" x="415.0" y="208.0" text-anchor="middle">user-audit.sh</text><text class="s" x="415.0" y="226.0" text-anchor="middle">logrotate + crontab examples</text><line x1="145" y1="260" x2="250" y2="318" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><line x1="415" y1="260" x2="310" y2="318" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="320" width="340" height="70" rx="10" fill="#FFFFFF" stroke="#A0AEC0" stroke-width="2"/><text class="t" x="280.0" y="342.0" text-anchor="middle">Results</text><text class="s" x="280.0" y="360.0" text-anchor="middle">text · JSON · CSV</text><text class="s" x="280.0" y="378.0" text-anchor="middle">exit 0 OK · 1 WARNING · 2 CRITICAL</text><line x1="280" y1="390" x2="280" y2="424" stroke="#1A2A4E" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="426" width="340" height="56" rx="10" fill="#E6F4EA" stroke="#2F7D4F" stroke-width="2" stroke-dasharray="6 4"/><text class="t" x="280.0" y="450.0" text-anchor="middle">Monitoring agent / log shipper</text><text class="s" x="280.0" y="468.0" text-anchor="middle">e.g. Azure Monitor Agent → Log Analytics</text><rect x="20" y="506" width="520" height="74" rx="10" fill="#FFF5E5" stroke="#B7791F" stroke-width="2"/><text class="t" x="280.0" y="539.0" text-anchor="middle">Changes state: Restart-StoppedAutoService.ps1</text><text class="s" x="280.0" y="557.0" text-anchor="middle">allow-listed services only · -WhatIf · confirms each restart by default</text></svg>
